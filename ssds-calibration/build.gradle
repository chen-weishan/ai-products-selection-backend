// ssds-calibration：因子統計與回測（規格書 FR-15）
// 規格 AC-15-2：建議權重必須由統計產生，AI 只負責解讀，
// 因此統計計算放在這裡，與 ssds-ai 分離。
// 規格寫「迴歸分析」，實作為 Spearman 相關＋傾斜收縮（理由見 FactorStatistics Javadoc）。
dependencies {
	implementation project(':ssds-core')

	implementation 'org.springframework:spring-context'
	implementation libs.jackson.databind
	// Spearman 等級相關（SpearmansCorrelation）與 t 分布 p 值（TDistribution）
	implementation libs.commons.math3

	testImplementation libs.test.spring.boot
}
