spring.application.name=ssds

# ===================================================================
# 外部設定檔匯入（機密值來源）
# ===================================================================

# 從專案根目錄的 .env 讀設定。.env 已加入 .gitignore，不會進版控。
#   optional:      檔案不存在也不會啟動失敗（部署環境改用真正的 OS 環境變數）
#   [.properties]  格式提示，告訴 Spring 這個沒有副檔名的檔案要當 properties 解析
# 優先序：OS 環境變數 > .env > 本檔案的預設值
spring.config.import=optional:file:./.env[.properties]


# ===================================================================
# Supabase PostgreSQL 連線設定
# ===================================================================

# Supabase 的 Transaction Pooler (Supavisor) 位址。
# port 6543 = transaction mode（每個 statement 用完就還連線，適合短連線、Serverless）
# port 5432 = session mode / 直連（支援 PREPARE、LISTEN/NOTIFY 等 session 層功能）
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${SUPABASE_DB_PORT:6543}/${SUPABASE_DB_NAME:postgres}

# 走 pooler 時帳號格式固定為 postgres.<project-ref>，不是單純的 postgres
spring.datasource.username=${SUPABASE_DB_USER:postgres.aozddonvsfdrtwpuxnqi}

# 刻意不給預設值：沒設定就在啟動當下直接失敗，好過連到一半才丟認證錯誤
spring.datasource.password=

# JDBC driver。classpath 只有一個 driver 時可省略，寫明比較不會被誤判
spring.datasource.driver-class-name=org.postgresql.Driver


# ===================================================================
# HikariCP 連線池
# ===================================================================

# 最大連線數。Supabase 免費方案的 pooler 連線額度不高，
# 前面已有 Supavisor 在做共用，本地 pool 開小即可
spring.datasource.hikari.maximum-pool-size=3

# 閒置時最少保留的連線數，避免每次請求都重新握手
spring.datasource.hikari.minimum-idle=1


# ===================================================================
# JPA / Hibernate
# ===================================================================

# 指定 PostgreSQL 方言，決定 Hibernate 產生的 SQL 語法
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema 自動同步策略：
#   none     完全不動 schema（正式環境建議，搭配 Flyway/Liquibase）
#   validate 只檢查 entity 與現有表是否相符，不符就啟動失敗
#   update   缺的表/欄位自動補上（不會刪任何東西）← 目前用這個，方便驗證連線
#   create-drop 每次啟動重建、關閉時刪除（僅測試用）
spring.jpa.hibernate.ddl-auto=update

# 把 Hibernate 執行的 SQL 印到 console，方便確認實際下了什麼查詢
spring.jpa.show-sql=true


# ===================================================================
# Transaction Pooler 相容性設定（走 6543 時必要）
# ===================================================================

# 關閉 driver 端的 server-side prepared statement。
# transaction mode 下每個 statement 可能落在不同的實體連線上，
# 快取的 prepared statement 會失效並丟 "prepared statement S_1 already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# 建立 CLOB/BLOB 時不使用 JDBC 的 LOB API。
# pooler 環境下 LOB 需要在同一條連線上維持狀態，關掉可避免報錯
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
