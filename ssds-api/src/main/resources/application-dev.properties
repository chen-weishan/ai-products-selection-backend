# ===================================================================
# 開發用設定（spring.profiles.active=dev 時生效）
# ===================================================================

# 在正式 migration 之外，追加開發用假資料的 location。
# db/dev 的 migration 一律以 V9xx 編號，排在正式 schema 之後執行，
# 且只有 dev profile 會載入 —— prod 不會看到這些檔案，也就不會有假資料。
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# 允許亂序套用。
#
# 假資料固定編在 V900 之後，好處是「schema 與假資料在版本序上永遠分得開」，
# 代價是：開發資料庫一旦跑到 V903，日後新增的 schema migration（V6、V7…）
# 版本號都比它小，Flyway 預設會判定為亂序並拒絕啟動。
#
# prod profile 只載入 db/migration，V1…Vn 本來就遞增，用不到這個開關，
# 所以它只開在 dev —— 開發資料庫是可拋棄的，亂序的風險可以接受。
#
# 要注意的例外：如果某支新 schema migration 會讓既有假資料失效
# （例如加一個 NOT NULL 且無預設值的欄位），在已經跑過假資料的開發庫上
# 就會失敗。遇到時最快的處理是砍掉重建，而不是想辦法補資料。
spring.flyway.out-of-order=true

# ===================================================================
# 共用開發資料庫：容忍本地 migration 檔案落後
# ===================================================================
#
# 本組共用同一個 Supabase 開發資料庫，schema migration 統一由一人套用。
# 其他人在還沒 pull 到新的 migration 檔案之前啟動，Flyway 會發現
# schema_history 裡有一筆本地不存在的紀錄，validate 失敗而無法啟動：
#     Detected applied migration not resolved locally: 7
#
# 該筆紀錄會被判為 missing 而非 future。判定條件是
# 「版本號 < 本地已解析的最高版本號」（BaseAppliedMigration#getState），
# 而本 profile 的 locations 含 db/dev，裡面是 V900–V904，
# 因此本地最高版本恆為 904，任何落後的 schema migration 一律落在 missing。
# Spring Boot 的預設值 *:future 在本專案形同虛設。
#
# 必須連 *:future 一起列出：本屬性是整組覆蓋而非附加，
# 只寫 *:missing 會把預設的 *:future 弄丟。
#
# 刻意不用 validate-on-migrate=false：那會連 checksum 檢查一併關閉，
# 而 checksum 負責攔截「已套用的 migration 檔案被事後修改」，
# 是這裡唯一需要留著的防線。本設定只放行「檔案不存在」。
#
# 代價：誤刪 migration 檔案不會有人發現。在 schema 由單一負責人維護的
# 前提下可以接受。prod profile 不載入本檔，維持嚴格驗證。
spring.flyway.ignore-migration-patterns=*:missing,*:future

# 把 Hibernate 執行的 SQL 印到 console，方便確認實際下了什麼查詢
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 開發時看得到 SQL 參數綁定值，排查條件錯誤用
logging.level.org.hibernate.orm.jdbc.bind=trace

# 規格書 §3.3 跨來源設定：開發環境前端跑在 4200，需明列來源並允許 credentials
ssds.cors.allowed-origins=http://localhost:4200

# 僅供 dev profile 的 HTTP Basic 測試帳號；可由環境變數覆蓋。
# 正式環境使用 FR-01 的 JWT 與資料庫帳號，不會載入這組設定。
ssds.security.dev.username=${DEV_SECURITY_USERNAME:sysadmin@ssds.dev}
ssds.security.dev.password=${DEV_SECURITY_PASSWORD:Ssds@2026}
