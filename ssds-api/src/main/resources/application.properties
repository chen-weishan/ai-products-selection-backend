spring.application.name=ssds

# ===================================================================
# Profile
# ===================================================================

# 預設啟用 dev：開發者 clone 下來直接跑就會有假資料（見 application-dev.properties）。
# 部署時以 OS 環境變數 SPRING_PROFILES_ACTIVE=prod 覆蓋。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ===================================================================
# 外部設定檔匯入（機密值來源）
# ===================================================================

# 從專案根目錄的 .env 讀設定。.env 已加入 .gitignore，不會進版控。
#   optional:      檔案不存在也不會啟動失敗（部署環境改用真正的 OS 環境變數）
#   [.properties]  格式提示，告訴 Spring 這個沒有副檔名的檔案要當 properties 解析
# 優先序：OS 環境變數 > .env > 本檔案的預設值
spring.config.import=optional:file:./.env[.properties]


# ===================================================================
# 功能開關（ENABLED 統一管理）
# ===================================================================

# Flyway schema migration：僅負責套用 migration 的環境啟用。
spring.flyway.enabled=${SSDS_FLYWAY_ENABLED:false}

# 外部 LLM 總開關：控制 Mistral 請求；關閉時改走規則 fallback。
ai.external-llm-enabled=${AI_EXTERNAL_LLM_ENABLED:true}

# 每週全量 AI 分析排程：控制每週主排程與後續恢復排程。
ai.full-analysis.schedule-enabled=${AI_FULL_ANALYSIS_SCHEDULE_ENABLED:false}

# 基礎評分排程：控制商品評分定期重算。
scoring.schedule-enabled=${SCORING_SCHEDULE_ENABLED:false}

# Agent 5 每日趨勢分析：每日熱度合成後加入 TrendInterpreterAgent 任務。
ai.trend.schedule-enabled=${AI_TREND_SCHEDULE_ENABLED:true}

# B 軌時效落差：每日熱度合成後重算 driving keyword 與 time gap。
ai.sourcing.time-gap-schedule-enabled=${AI_SOURCING_TIME_GAP_SCHEDULE_ENABLED:true}

# AI 校準排程：控制季度校準任務。
ai.calibration.schedule-enabled=${AI_CALIBRATION_SCHEDULE_ENABLED:false}

# Instagram 熱度來源：控制正常 cron、手動入口與啟動補跑是否可採集。
ssds.ingest.instagram.enabled=${SSDS_INGEST_INSTAGRAM_ENABLED:true}

# Threads 熱度來源：控制正常 cron、手動入口與啟動補跑是否可採集。
ssds.ingest.threads.enabled=${SSDS_INGEST_THREADS_ENABLED:false}

# Google Trends 熱度來源：控制正常 cron、手動入口與啟動補跑是否可採集。
ssds.ingest.google-trends.enabled=${SSDS_INGEST_GOOGLE_TRENDS_ENABLED:true}

# 啟動補跑總開關：啟動於 06:00 後且當日資料不完整時補跑；來源開關仍是上層門檻。
ssds.calibration.heat-catch-up-enabled=${HEAT_CATCH_UP_ENABLED:false}


# ===================================================================
# Supabase PostgreSQL 連線設定
# ===================================================================

# Supabase 的 Transaction Pooler (Supavisor) 位址。
# port 6543 = transaction mode（每個 statement 用完就還連線，適合短連線、Serverless）
# port 5432 = session mode / 直連（支援 PREPARE、LISTEN/NOTIFY 等 session 層功能）
spring.datasource.url=jdbc:postgresql://${SSDS_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${SSDS_DB_PORT:6543}/${SSDS_DB_NAME:postgres}

# 走 pooler 時帳號格式固定為 <角色名>.<project-ref>，不是單純的角色名。
# 預設為 V16 建立的受限角色 ssds_app：可讀寫資料，但不是任何表的 owner，
# 不能 DDL、不能 TRUNCATE、改不了 flyway_schema_history。
# 日常開發與應用程式一律用它，不要再用 postgres 連線。
spring.datasource.username=${SSDS_DB_USER:ssds_app.aozddonvsfdrtwpuxnqi}

# 刻意不給預設值：沒設定就在啟動當下直接失敗，好過連到一半才丟認證錯誤
spring.datasource.password=${SSDS_DB_PASSWORD}

# JDBC driver。classpath 只有一個 driver 時可省略，寫明比較不會被誤判
spring.datasource.driver-class-name=org.postgresql.Driver


# ===================================================================
# HikariCP 連線池
# ===================================================================

# 最大連線數。Supabase 免費方案的 pooler 連線額度不高，
# 前面已有 Supavisor 在做共用，本地 pool 開小即可
spring.datasource.hikari.maximum-pool-size=3

# 閒置時最少保留的連線數，避免每次請求都重新握手
spring.datasource.hikari.minimum-idle=1


# ===================================================================
# Flyway（schema 版控，規格書 §3.2）
# ===================================================================

# 預設關閉。共用資料庫的 schema 由單一負責人套用，其他人不需要也不應該
# 在自己機器上跑 migration —— 2026-08-21 的事故正是多人各自對共用庫動手造成的。
# 而且日常連線角色 ssds_app 對 flyway_schema_history 只有 SELECT，
# 開著 Flyway 只會在啟動時因為寫不進帳本而失敗。
# 負責套用 migration 的人在自己的 .env 設 SSDS_FLYWAY_ENABLED=true，
# 並另外提供下面那組 migration 專用連線資訊。

# 重點：Flyway 不能走 6543。
# Flyway 以 pg_advisory_lock 防止多節點同時 migrate，而 advisory lock 是
# session 層級的狀態；transaction pooler 每個 statement 可能落在不同實體連線，
# 鎖會在下一個 statement 就失效。因此 Flyway 單獨指向 5432（session mode）。
#
# migration 連線與應用連線是兩組不同的身分，刻意分開：
# 套用 migration 需要 owner 權限（建表、改約束），日常連線不需要也不該有。
spring.flyway.url=jdbc:postgresql://${SSDS_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${SSDS_DB_SESSION_PORT:5432}/${SSDS_DB_NAME:postgres}
spring.flyway.user=${SSDS_MIGRATION_DB_USER:postgres.aozddonvsfdrtwpuxnqi}
spring.flyway.password=${SSDS_MIGRATION_DB_PASSWORD:}

# 只放正式 schema；假資料由 dev profile 另外追加 location
spring.flyway.locations=classpath:db/migration

# Supabase 的 public schema 已存在既有物件（非空），
# 首次執行需允許 Flyway 在非空 schema 上建立基線
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# ===================================================================
# JPA / Hibernate
# ===================================================================

# 不指定 hibernate.dialect：Hibernate 6 起會依連線自動判斷方言，
# 明寫反而會在啟動時發出 HHH90000025 警告。已由連線確認為 PostgreSQLDialect。

# Schema 由 Flyway 管理，Hibernate 只做「Entity 與現有表是否相符」的檢查。
#   none     完全不動 schema
#   validate 只檢查 entity 與現有表是否相符，不符就啟動失敗 ← 目前用這個
#   update   缺的表/欄位自動補上（會讓 Flyway 版本與實際 schema 脫節，禁用）
#   create-drop 每次啟動重建、關閉時刪除（僅測試用）
spring.jpa.hibernate.ddl-auto=none

# 關閉 open-session-in-view。
# 規格書 §7.3 明令「禁止在 Controller 層觸發 lazy loading」，
# 開著這個選項會讓 N+1 悄悄發生卻不報錯，關掉才會在越界時直接丟例外。
spring.jpa.open-in-view=false

# Schema 明確指定為 public。
# 走 Supabase transaction pooler (6543) 時，Supavisor 給的 search_path 是
#   auth, "$user", public, extensions
# 也就是 current_schema() 會是 auth 而不是 public。Hibernate 的 ddl-auto=validate
# 依 current_schema() 去比對，結果會報「missing table [ai_insight]」——
# 表其實在，只是找錯 schema。指定 default_schema 後 Hibernate 會產生
# public.xxx 的完整名稱，不再依賴 search_path 的順序。
# （走 5432 session mode 時 current_schema() 本來就是 public，設了也無妨。）
spring.jpa.properties.hibernate.default_schema=public

# 規格書 §7.3：大量匯入使用 JDBC batch insert，batch size 500
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# ===================================================================
# 時區（規格書 §3.2：資料庫存 UTC，應用層轉換）
# ===================================================================

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===================================================================
# Transaction Pooler 相容性設定（走 6543 時必要）
# ===================================================================

# 關閉 driver 端的 server-side prepared statement。
# transaction mode 下每個 statement 可能落在不同的實體連線上，
# 快取的 prepared statement 會失效並丟 "prepared statement S_1 already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# 建立 CLOB/BLOB 時不使用 JDBC 的 LOB API。
# pooler 環境下 LOB 需要在同一條連線上維持狀態，關掉可避免報錯
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ===================================================================
# API
# ===================================================================

# 規格書 §3.3：API 路徑統一前綴 /api/v1。
# 設在 context-path 而非各 Controller 的 @RequestMapping：
# 前綴只有一處可改，Controller 一律只寫資源路徑（例如 /products）。
# 副作用：springdoc 的兩個路徑也一起位移到 /api/v1 底下。
server.servlet.context-path=/api/v1
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================================================
# A 軌 AI（Spring Boot 直連 Mistral Conversations API，不經 MCP）
# ===================================================================
mistral.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
mistral.api-key=${MISTRAL_API_KEY:}
mistral.model-classify-primary=${MODEL_CLASSIFY_PRIMARY:mistral-medium-3-5}
mistral.model-classify-fallbacks=${MODEL_CLASSIFY_FALLBACK:mistral-small-latest,magistral-medium-latest}
mistral.model-long-text-primary=${MODEL_LONG_TEXT_PRIMARY:mistral-medium-3-5}
mistral.model-long-text-fallbacks=${MODEL_LONG_TEXT_FALLBACK:mistral-small-latest,magistral-medium-latest}
mistral.model-short-gen-primary=${MODEL_SHORT_GEN_PRIMARY:mistral-small-latest}
mistral.model-short-gen-fallbacks=${MODEL_SHORT_GEN_FALLBACK:mistral-medium-3-5,magistral-medium-latest}
mistral.model-numeric-primary=${MODEL_NUMERIC_PRIMARY:mistral-small-latest}
mistral.model-numeric-fallbacks=${MODEL_NUMERIC_FALLBACK:mistral-medium-3-5,magistral-medium-latest}
mistral.timeout-seconds=${LLM_TIMEOUT_SECONDS:30}
mistral.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:10}
ai.retry-max=${LLM_RETRY_MAX:3}
ai.rate-limit-per-minute=${LLM_RATE_LIMIT_PER_MINUTE:20}
ai.cache-days=${AI_CACHE_DAYS:6}
ai.quota-daily=${LLM_QUOTA_DAILY:1000}
ai.quota-share-track-a=${LLM_QUOTA_SHARE_TRACK_A:0.7}
ai.quota-share-track-b=${LLM_QUOTA_SHARE_TRACK_B:0.2}
ai.quota-share-retry=${LLM_QUOTA_SHARE_RETRY:0.1}
ai.batch-item-cap=${LLM_BATCH_ITEM_CAP:150}
ai.full-analysis.schedule-cron=${SCHEDULE_FULL_SCORING:0 0 7 * * MON}
ai.full-analysis.resume-cron=${SCHEDULE_FULL_SCORING_RESUME:0 0 7 * * TUE-SUN}
scoring.schedule-cron=${SCORING_SCHEDULE_CRON:0 50 6 * * MON}
ai.cache-days-trend=${AI_CACHE_DAYS_TREND:3}

# 正式評分的歷史同期氣候區域；短期預報不得使用於評分。
ssds.scoring.climate-region=${SSDS_SCORING_CLIMATE_REGION:TW_NORTH}
ai.calibration.schedule-cron=${SCHEDULE_CALIBRATION:0 0 8,9 1 1,4,7,10 *}

# B 軌 Agent 6：Mistral Conversations + 單一搜尋 Connector（額度限制時輪替）
mistral.model-reasoning-primary=${MODEL_REASONING_PRIMARY:mistral-medium-3-5}
mistral.model-reasoning-fallbacks=${MODEL_REASONING_FALLBACK:mistral-small-latest,magistral-medium-latest}
mistral.sourcing-timeout-seconds=${LLM_TIMEOUT_SCOUT_SECONDS:90}
mistral.sourcing-connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SCOUT_SECONDS:10}
ai.cache-days-sourcing=${AI_CACHE_DAYS_SOURCING:3}
mistral.sourcing-connectors=${MISTRAL_SOURCING_CONNECTORS:parallel_search,exa_search,tavily_search}
mcp.allowed-tools=${MCP_ALLOWED_TOOLS:parallel_search,exa_search,tavily_search}

# 品項圖片：檔案存本機／掛載磁碟，資料庫只保存相對路徑。
# 正式環境應以 SSDS_PRODUCT_IMAGE_STORAGE_PATH 指向持久化 volume。
ssds.product-image.storage-path=${SSDS_PRODUCT_IMAGE_STORAGE_PATH:./uploads/product}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# ===================================================================
# JSON 序列化（規格書 §8.1）
# ===================================================================

# §8.1：日期一律 ISO-8601，回應以 +08:00 呈現。
#
# Boot 4 差異：Jackson 3 預設就輸出 ISO-8601，且 SerializationFeature 已移除
# WRITE_DATES_AS_TIMESTAMPS。Boot 3 教學常見的
# spring.jackson.serialization.write-dates-as-timestamps=false
# 在這裡會讓服務「啟動失敗」（找不到該 enum 常數），不要加。

# 序列化時區。實測（2026-08-22）：對 java.time.Instant 無效，Instant 仍輸出 Z。
# 只對 java.util.Date／Calendar 這類舊型別有作用。
# §8.1 的「一律 +08:00」真正靠的是「DTO 日期欄位一律用 OffsetDateTime」，見 CONTEXT.md。
spring.jackson.time-zone=Asia/Taipei


# ===================================================================
# Instagram 熱度來源（規格書未定義，實作擴充；透過 Apify 官方 actor）
# ===================================================================

# 2026-09-01 改版：不再用 Meta 官方 Graph API（App Review／Business
# Verification 過不了）。
# 2026-09-07 再改版：不再用 RapidAPI 的 instagram-social（查總貼文數），
# 改用 Apify 平台的官方 actor apify/instagram-hashtag-scraper（實際爬貼文，
# 熱度改以按讚數+留言數總和計算，見 InstagramHashtagClient 類別註解）。
# 刻意不給 apify-token 預設值：未設定時 InstagramIngestProperties.configured()
# 回傳 false，排程會直接跳過（見 InstagramHeatSourceAdapter），不會用空字串
# 打出必敗的請求。
ssds.ingest.instagram.apify-token=${SSDS_IG_APIFY_TOKEN:}
ssds.ingest.instagram.cron=${SSDS_INGEST_INSTAGRAM_CRON:0 30 3 * * MON}
# 每個 hashtag 抓幾篇貼文來算熱度；愈大愈準但愈耗用量，預設 20。
ssds.ingest.instagram.results-limit=${SSDS_IG_RESULTS_LIMIT:20}

# ===================================================================
# Threads 熱度來源（規格書要求官方 API，官方審核路線已放棄，比照 Instagram
# 改用 Apify 第三方 actor；理由見 ThreadsIngestProperties）
# ===================================================================
ssds.ingest.threads.apify-token=${SSDS_THREADS_APIFY_TOKEN:}
ssds.ingest.threads.results-limit=${SSDS_THREADS_RESULTS_LIMIT:10}
ssds.ingest.threads.lookback-days=${SSDS_THREADS_LOOKBACK_DAYS:3}
ssds.ingest.threads.end-lookback-days=${SSDS_THREADS_END_LOOKBACK_DAYS:0}
ssds.ingest.threads.search-filter=${SSDS_THREADS_SEARCH_FILTER:top}
ssds.ingest.threads.cron=${SSDS_INGEST_THREADS_CRON:0 0 3 * * *}

# ===================================================================
# Google Trends 熱度來源（規格書承認無官方 API，改用 Apify 第三方 actor）
# ===================================================================
ssds.ingest.google-trends.apify-token=${SSDS_TRENDS_APIFY_TOKEN:}
ssds.ingest.google-trends.max-items=${SSDS_TRENDS_MAX_ITEMS:30}
ssds.ingest.google-trends.time-range=${SSDS_TRENDS_TIME_RANGE:now 1-d}
ssds.ingest.google-trends.geo=${SSDS_TRENDS_GEO:TW}
ssds.ingest.google-trends.cron=${SSDS_INGEST_GOOGLE_TRENDS_CRON:0 15 3 * * *}
ssds.calibration.heat-composite.cron=${SCHEDULE_HEAT_COLLECT:0 0 6 * * *}

ssds.jwt.secret=${SSDS_JWT_SECRET:dev-only-insecure-secret-please-override-in-production-min-32-bytes}
ssds.jwt.access-ttl-minutes=${SSDS_JWT_ACCESS_TTL_MINUTES:12000}
ssds.jwt.refresh-ttl-days=${SSDS_JWT_REFRESH_TTL_DAYS:7}

