spring.application.name=ssds

# ===================================================================
# Profile
# ===================================================================

# 預設啟用 dev：開發者 clone 下來直接跑就會有假資料（見 application-dev.properties）。
# 部署時以 OS 環境變數 SPRING_PROFILES_ACTIVE=prod 覆蓋。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ===================================================================
# 外部設定檔匯入（機密值來源）
# ===================================================================

# 從專案根目錄的 .env 讀設定。.env 已加入 .gitignore，不會進版控。
#   optional:      檔案不存在也不會啟動失敗（部署環境改用真正的 OS 環境變數）
#   [.properties]  格式提示，告訴 Spring 這個沒有副檔名的檔案要當 properties 解析
# 優先序：OS 環境變數 > .env > 本檔案的預設值
spring.config.import=optional:file:./.env[.properties]


# ===================================================================
# Supabase PostgreSQL 連線設定
# ===================================================================

# Supabase 的 Transaction Pooler (Supavisor) 位址。
# port 6543 = transaction mode（每個 statement 用完就還連線，適合短連線、Serverless）
# port 5432 = session mode / 直連（支援 PREPARE、LISTEN/NOTIFY 等 session 層功能）
spring.datasource.url=jdbc:postgresql://${SSDS_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${SSDS_DB_PORT:6543}/${SSDS_DB_NAME:postgres}

# 走 pooler 時帳號格式固定為 <角色名>.<project-ref>，不是單純的角色名。
# 預設為 V16 建立的受限角色 ssds_app：可讀寫資料，但不是任何表的 owner，
# 不能 DDL、不能 TRUNCATE、改不了 flyway_schema_history。
# 日常開發與應用程式一律用它，不要再用 postgres 連線。
spring.datasource.username=${SSDS_DB_USER:ssds_app.aozddonvsfdrtwpuxnqi}

# 刻意不給預設值：沒設定就在啟動當下直接失敗，好過連到一半才丟認證錯誤
spring.datasource.password=${SSDS_DB_PASSWORD}

# JDBC driver。classpath 只有一個 driver 時可省略，寫明比較不會被誤判
spring.datasource.driver-class-name=org.postgresql.Driver


# ===================================================================
# HikariCP 連線池
# ===================================================================

# 最大連線數。Supabase 免費方案的 pooler 連線額度不高，
# 前面已有 Supavisor 在做共用，本地 pool 開小即可
spring.datasource.hikari.maximum-pool-size=3

# 閒置時最少保留的連線數，避免每次請求都重新握手
spring.datasource.hikari.minimum-idle=1


# ===================================================================
# Flyway（schema 版控，規格書 §3.2）
# ===================================================================

# 預設關閉。共用資料庫的 schema 由單一負責人套用，其他人不需要也不應該
# 在自己機器上跑 migration —— 2026-08-21 的事故正是多人各自對共用庫動手造成的。
# 而且日常連線角色 ssds_app 對 flyway_schema_history 只有 SELECT，
# 開著 Flyway 只會在啟動時因為寫不進帳本而失敗。
# 負責套用 migration 的人在自己的 .env 設 SSDS_FLYWAY_ENABLED=true，
# 並另外提供下面那組 migration 專用連線資訊。
spring.flyway.enabled=${SSDS_FLYWAY_ENABLED:false}

# 重點：Flyway 不能走 6543。
# Flyway 以 pg_advisory_lock 防止多節點同時 migrate，而 advisory lock 是
# session 層級的狀態；transaction pooler 每個 statement 可能落在不同實體連線，
# 鎖會在下一個 statement 就失效。因此 Flyway 單獨指向 5432（session mode）。
#
# migration 連線與應用連線是兩組不同的身分，刻意分開：
# 套用 migration 需要 owner 權限（建表、改約束），日常連線不需要也不該有。
spring.flyway.url=jdbc:postgresql://${SSDS_DB_HOST:aws-0-ap-south-1.pooler.supabase.com}:${SSDS_DB_SESSION_PORT:5432}/${SSDS_DB_NAME:postgres}
spring.flyway.user=${SSDS_MIGRATION_DB_USER:postgres.aozddonvsfdrtwpuxnqi}
spring.flyway.password=${SSDS_MIGRATION_DB_PASSWORD:}

# 只放正式 schema；假資料由 dev profile 另外追加 location
spring.flyway.locations=classpath:db/migration

# Supabase 的 public schema 已存在既有物件（非空），
# 首次執行需允許 Flyway 在非空 schema 上建立基線
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0


# ===================================================================
# JPA / Hibernate
# ===================================================================

# 不指定 hibernate.dialect：Hibernate 6 起會依連線自動判斷方言，
# 明寫反而會在啟動時發出 HHH90000025 警告。已由連線確認為 PostgreSQLDialect。

# Schema 由 Flyway 管理，Hibernate 只做「Entity 與現有表是否相符」的檢查。
#   none     完全不動 schema
#   validate 只檢查 entity 與現有表是否相符，不符就啟動失敗 ← 目前用這個
#   update   缺的表/欄位自動補上（會讓 Flyway 版本與實際 schema 脫節，禁用）
#   create-drop 每次啟動重建、關閉時刪除（僅測試用）
spring.jpa.hibernate.ddl-auto=validate

# 關閉 open-session-in-view。
# 規格書 §7.3 明令「禁止在 Controller 層觸發 lazy loading」，
# 開著這個選項會讓 N+1 悄悄發生卻不報錯，關掉才會在越界時直接丟例外。
spring.jpa.open-in-view=false

# Schema 明確指定為 public。
# 走 Supabase transaction pooler (6543) 時，Supavisor 給的 search_path 是
#   auth, "$user", public, extensions
# 也就是 current_schema() 會是 auth 而不是 public。Hibernate 的 ddl-auto=validate
# 依 current_schema() 去比對，結果會報「missing table [ai_insight]」——
# 表其實在，只是找錯 schema。指定 default_schema 後 Hibernate 會產生
# public.xxx 的完整名稱，不再依賴 search_path 的順序。
# （走 5432 session mode 時 current_schema() 本來就是 public，設了也無妨。）
spring.jpa.properties.hibernate.default_schema=public

# 規格書 §7.3：大量匯入使用 JDBC batch insert，batch size 500
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# ===================================================================
# 時區（規格書 §3.2：資料庫存 UTC，應用層轉換）
# ===================================================================

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===================================================================
# Transaction Pooler 相容性設定（走 6543 時必要）
# ===================================================================

# 關閉 driver 端的 server-side prepared statement。
# transaction mode 下每個 statement 可能落在不同的實體連線上，
# 快取的 prepared statement 會失效並丟 "prepared statement S_1 already exists"
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# 建立 CLOB/BLOB 時不使用 JDBC 的 LOB API。
# pooler 環境下 LOB 需要在同一條連線上維持狀態，關掉可避免報錯
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# ===================================================================
# API
# ===================================================================

# 規格書 §3.3：API 路徑統一前綴 /api/v1。
# 設在 context-path 而非各 Controller 的 @RequestMapping：
# 前綴只有一處可改，Controller 一律只寫資源路徑（例如 /products）。
# 副作用：springdoc 的兩個路徑也一起位移到 /api/v1 底下。
server.servlet.context-path=/api/v1
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


# ===================================================================
# JSON 序列化（規格書 §8.1）
# ===================================================================

# §8.1：日期一律 ISO-8601，回應以 +08:00 呈現。
#
# Boot 4 差異：Jackson 3 預設就輸出 ISO-8601，且 SerializationFeature 已移除
# WRITE_DATES_AS_TIMESTAMPS。Boot 3 教學常見的
# spring.jackson.serialization.write-dates-as-timestamps=false
# 在這裡會讓服務「啟動失敗」（找不到該 enum 常數），不要加。

# 序列化時區。實測（2026-08-22）：對 java.time.Instant 無效，Instant 仍輸出 Z。
# 只對 java.util.Date／Calendar 這類舊型別有作用。
# §8.1 的「一律 +08:00」真正靠的是「DTO 日期欄位一律用 OffsetDateTime」，見 CONTEXT.md。
spring.jackson.time-zone=Asia/Taipei


