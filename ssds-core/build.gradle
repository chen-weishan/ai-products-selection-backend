// ssds-core：領域模型、ScoringEngine、RiskRuleEngine
// 依賴方向的最底層，不依賴任何其他 ssds 模組，也不依賴 JPA。
// 刻意保持「純 Java + 少量 Spring」：計分邏輯要能不開資料庫就單元測試。
dependencies {
	implementation libs.spring.boot.starter.validation
	// 需要 @Component / @Service 等註解，但不要整個 web 或 jpa
	implementation 'org.springframework:spring-context'
	implementation libs.jackson.databind
	// 農曆→國曆換算（FR-17 AC-17-1）。選型理由見 progress.md
	implementation libs.icu4j

	testImplementation libs.test.spring.boot

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}
